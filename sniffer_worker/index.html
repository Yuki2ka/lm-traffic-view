<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>LM Studio Proxy Debugger</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0e14;
			--panel: #111827;
			--border: #263244;
			--muted: #9ca3af;
			--text: #e5e7eb;
			--agent: #38bdf8;
			--studio: #a78bfa;
			--err: #fb7185;
			--ok: #34d399;
			--warn: #fbbf24;
			--toggle-on: #2563eb;
			--toggle-on-border: #60a5fa;
		}
		body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
		#toolbar { height:48px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--border); background:#05070b; }
		button,input { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; }
		button:hover { border-color:#4b5563; cursor:pointer; }
		input { width:360px; }
		button.toggle-on { background:var(--toggle-on); border-color:var(--toggle-on-border); color:#fff; box-shadow:0 0 6px rgba(37,99,235,.45); }
		button.toggle-off { background:#1e1e2e; border-color:#3b3b50; color:#9ca3af; }
		button.btn-clear { background:#7f1d1d; border-color:#b91c1c; color:#fca5a5; }
		button.btn-clear:hover { background:#991b1b; border-color:#ef4444; }
		#status { margin-left:auto; color:var(--muted); font-size:13px; }
		#log { height:calc(100vh - 49px); overflow:auto; padding:10px; box-sizing:border-box; }
		.event { border:1px solid var(--border); background:rgba(17,24,39,.75); border-radius:10px; margin-bottom:8px; overflow:hidden; }
		.head { display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; border-bottom:1px solid rgba(38,50,68,.7); }
		.seq { color:var(--muted); width:64px; flex:0 0 auto; }
		.time { color:var(--muted); width:90px; flex:0 0 auto; }
		.dir.agent { color:var(--agent); }
		.dir.studio { color:var(--studio); }
		.kind { color:#d1d5db; background:#1f2937; padding:2px 6px; border-radius:999px; flex:0 0 auto; }
		.summary { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		.summary.done { color:var(--ok); }
		.summary.err { color:var(--err); }
		.body { padding:8px 10px 10px; display:none; }
		.event.open .body { display:block; }
		.event-group { border:1px solid #2d3748; border-radius:10px; margin-bottom:8px; overflow:hidden; }
		.event-group summary { display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; cursor:pointer; list-style:none; background:rgba(17,24,39,.85); user-select:none; }
		.event-group summary::-webkit-details-marker { display:none; }
		.event-group summary::before { content:"▶"; font-size:9px; color:var(--muted); transition:transform .15s; flex:0 0 auto; }
		.event-group[open] summary::before { transform:rotate(90deg); }
		.group-badge { background:#374151; color:#d1d5db; padding:1px 7px; border-radius:999px; font-size:12px; flex:0 0 auto; }
		.group-chars { color:var(--muted); font-size:12px; flex:0 0 auto; }
		.group-body { padding:4px; }
		.group-body .event { margin-bottom:4px; border-color:#1e293b; }
		.group-body .event .head { padding:5px 10px; font-size:12px; }
		.group-body .event .head .summary { color:var(--muted); }
		pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:12px; line-height:1.45; }
		.json-key { color:#93c5fd; }
		.big { border:1px dashed #374151; border-radius:8px; padding:8px; margin:4px 0; color:var(--muted); }
		.hidden { display:none; }

		/* ═══ modal ═══ */
		.modal { background:var(--panel); border:1px solid var(--border); border-radius:14px; width:760px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.5); }
		.modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; }
		.modal-header .close-btn { background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; padding:0 4px; line-height:1; }
		.modal-header .close-btn:hover { color:var(--text); }
		.modal-body { overflow-y:auto; padding:14px 18px; }
		.modal-body table { width:100%; border-collapse:collapse; font-size:13px; }
		.modal-body th { text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border); font-size:12px; }
		.modal-body td { padding:8px; border-bottom:1px solid #1a2233; vertical-align:middle; }
		tr.server-row { cursor:pointer; }
		tr.server-row:hover { background:rgba(56,189,248,.06); }
		tr.server-row.selected { background:rgba(37,99,235,.18); }
		tr.server-row.selected td:first-child { border-left:3px solid var(--toggle-on); padding-left:5px; }
		.modal-body a { color:var(--agent); text-decoration:none; }
		.modal-body a:hover { text-decoration:underline; }
		.status-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; flex:0 0 auto; }
		.status-dot.checking { background:var(--warn); animation:pulse .8s infinite alternate; }
		.status-dot.online { background:var(--ok); }
		.status-dot.offline { background:#4b5563; }
		@keyframes pulse { from{opacity:.4} to{opacity:1} }
		.modal-footer { padding:12px 18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
		.right { margin-left:auto; }

		/* ═══ startup ═══ */
		#startupOverlay { position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; justify-content:center; align-items:center; }
		#startupOverlay .modal { width:840px; max-height:90vh; }
		.option-cards { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
		.option-card { flex:1; min-width:240px; border:2px solid var(--border); border-radius:10px; padding:16px; cursor:pointer; transition:border-color .15s,background .15s; background:rgba(17,24,39,.5); }
		.option-card:hover { border-color:#4b5563; }
		.option-card.selected { border-color:var(--toggle-on); background:rgba(37,99,235,.12); }
		.option-card .opt-title { font-weight:600; font-size:14px; margin-bottom:8px; }
		.option-card .opt-desc { font-size:12px; color:var(--muted); line-height:1.6; }
		.option-card .opt-diagram { margin-top:12px; font-family:ui-monospace,monospace; font-size:11px; color:var(--agent); background:#0b0e14; padding:8px; border-radius:6px; line-height:1.7; }
		.opt-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; font-weight:500; margin-left:6px; }
		.btn-primary { background:#1d4ed8; border-color:#3b82f6; color:#fff; padding:9px 24px; font-weight:600; font-size:14px; }
		.btn-primary:hover { background:#2563eb; }
		.btn-primary:disabled { opacity:.4; cursor:not-allowed; }
		#modeIndicator { font-size:12px; padding:4px 10px; border-radius:999px; background:#1e293b; border:1px solid var(--border); color:var(--muted); cursor:pointer; }
		#modeIndicator:hover { border-color:#4b5563; }
		.badge-warn { background:#713f12; color:#fde68a; }
		.badge-ok { background:#166534; color:#86efac; }
		.badge-auto { background:#166534; color:#86efac; }
		.badge-blue { background:#1e3a8a; color:#93c5fd; }
	</style>
</head>
<body>

<!-- ═══ STARTUP ═══ -->
<div id="startupOverlay">
<div class="modal">
	<div class="modal-header"><span>🚀 LM Studio Proxy — Setup</span></div>
	<div class="modal-body">
		<p id="scanMsg" style="margin:0 0 14px;color:var(--muted);font-size:13px;">Scanning for servers…</p>
		<table>
			<thead><tr><th style="width:28px"></th><th>Server</th><th>Port</th><th>Endpoint</th><th>Download</th></tr></thead>
			<tbody id="startupBody"></tbody>
		</table>
		<div id="optionsSection" class="hidden">
			<div style="margin:20px 0 8px;font-weight:600;font-size:14px;" id="optionsTitle"></div>
			<div class="option-cards" id="optionCards"></div>
			<div id="optionSummary" style="font-size:13px;color:var(--muted);min-height:40px;"></div>
		</div>
	</div>
	<div class="modal-footer">
		<button class="btn-primary" id="btnGo" disabled onclick="confirmStartup()">Apply & Continue →</button>
		<span class="right" id="goSummary"></span>
	</div>
</div>
</div>

<!-- ═══ MAIN UI ═══ -->
<div id="mainUI" class="hidden">
<div id="toolbar">
	<button class="btn-clear" onclick="clearLog()">Clear</button>
	<button onclick="expandAll()">Expand all</button>
	<button onclick="collapseAll()">Collapse all</button>
	<button id="btnNewOnTop" class="toggle-on" onclick="toggleNewOnTop()">New on top</button>
	<button id="btnAutoScroll" class="toggle-off" onclick="toggleAutoScroll()">Auto-scroll</button>
	<label style="font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;">
		<input type="checkbox" id="hideEmpty" onchange="applyFilter()" style="width:auto;" /> Hide 0-byte
	</label>
	<span id="modeIndicator" onclick="reopenStartup()" title="Click to change server / mode"></span>
	<input id="filter" placeholder="filter…" oninput="applyFilter()" />
	<span id="status"></span>
</div>
<div id="log"></div>
</div>



<script>
const SERVERS = [
	{ name:"Jan.ai",                port:1337,  ep:"v1/models",          url:"https://github.com/janhq/jan/releases" },
	{ name:"LM Studio",             port:1234,  ep:"v1/chat/completions", url:"https://lmstudio.ai/download" },
	{ name:"llama.cpp",             port:8080,  ep:"v1/chat/completions", url:"https://github.com/ggerganov/llama.cpp/releases" },
	{ name:"ik_llama.cpp",          port:8080,  ep:"v1/chat/completions", url:"https://github.com/ikawrakow/ik_llama.cpp/releases" },
	{ name:"KoboldCPP",             port:5001,  ep:"api/v1/generate",     url:"https://github.com/LostRuins/koboldcpp/releases" },
	{ name:"Ollama",                port:11434, ep:"api/tags",            url:"https://ollama.com/download/" },
	{ name:"vLLM",                  port:8000,  ep:"v1/chat/completions", url:"https://docs.vllm.ai/en/latest/getting_started/installation.html" },
	{ name:"LocalAI",               port:8080,  ep:"v1/models",          url:"https://github.com/mudler/LocalAI/releases" },
	{ name:"Text Generation WebUI", port:7860,  ep:"v1/chat/completions", url:"https://github.com/oobabooga/text-generation-webui/releases" },
];

let currentTarget="", chosenMode="", chosenProxyPort=0, chosenTargetPort=0;

// ═══════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════

async function initStartup(forceShow) {
	try {
		let c = await (await fetch("/api/config")).json();
		if (c.configured && !forceShow) { finishUI(c); return; }
	} catch(e){}

	let tbody = document.getElementById("startupBody");
	tbody.innerHTML = "";

	// render skeleton rows for known ports
	SERVERS.forEach(s => {
		if (tbody.querySelector(`[data-port="${s.port}"]`)) return; // skip dup ports
		let tr = document.createElement("tr");
		tr.className = "server-row";
		tr.dataset.port = s.port;
		tr.innerHTML = `<td><span class="status-dot checking"></span></td>
			<td style="font-weight:500">${esc(s.name)}</td><td>${s.port}</td>
			<td style="color:var(--muted);font-size:12px">${esc(s.ep)}</td>
			<td><a href="${esc(s.url)}" target="_blank" onclick="event.stopPropagation()">↗</a></td>`;
		tbody.appendChild(tr);
	});

	// scan via backend
	let scan;
	try { scan = await (await fetch("/api/scan")).json(); } catch(e){ scan={servers:[]}; }

	// update dots + add non-standard rows
	scan.servers.forEach(srv => {
		let tr = tbody.querySelector(`[data-port="${srv.port}"]`);
		if (tr) {
			tr.querySelector(".status-dot").className = "status-dot " + (srv.open ? "online" : "offline");
		} else if (srv.open) {
			// extra row for non-standard detected port
			let extra = document.createElement("tr");
			extra.className = "server-row";
			extra.dataset.port = srv.port;
			extra.dataset.name = srv.name;
			extra.dataset.nonStandard = "1";
			extra.innerHTML = `<td><span class="status-dot online"></span></td>
				<td style="font-weight:500">${esc(srv.name)}</td>
				<td>${srv.port} <span style="color:var(--warn);font-size:10px">(non-standard)</span></td>
				<td style="color:var(--muted);font-size:12px">${esc(srv.endpoint)}</td>
				<td>—</td>`;
			tbody.appendChild(extra);
		}
	});

	let online = scan.servers.filter(s => s.open);
	if (!online.length) {
		document.getElementById("scanMsg").innerHTML = '<span style="color:var(--err)">No servers detected. Start a server and reload.</span>';
		return;
	}

	// pick the first online server
	let match = online[0];

	// highlight
	tbody.querySelectorAll(".server-row").forEach(r => r.classList.remove("selected"));
	let sel = tbody.querySelector(`[data-port="${match.port}"]`);
	if (sel) sel.classList.add("selected");

	let portInfo = match.nonStandard
		? `<code>127.0.0.1:${match.port}</code> <span style="color:var(--warn)">(standard port for ${esc(match.name)} is :${match.parentPort || "?"})</span>`
		: `<code>127.0.0.1:${match.port}</code> (standard)`;
	document.getElementById("scanMsg").innerHTML =
		`Detected <strong style="color:var(--ok)">${esc(match.name)}</strong> on ${portInfo}`;

	buildOptions(match);
}

function buildOptions(detected) {
	let section = document.getElementById("optionsSection");
	let title   = document.getElementById("optionsTitle");
	let cards   = document.getElementById("optionCards");
	section.classList.remove("hidden");
	cards.innerHTML = "";

	// Find standard port: use parentPort from scan, or look up by name
	let standardPort = detected.parentPort;
	if (!standardPort) {
		let serverDef = SERVERS.find(s => s.name === detected.name);
		standardPort = serverDef ? serverDef.port : detected.port;
	}

	let isStandard = (detected.port === standardPort) && !detected.nonStandard;

	if (isStandard) {
		// ── CASE 1: server on its standard port ──
		// Agent and server are both on 127.0.0.1:1234 (or other standard).
		// Default: passive sniff, no config changes.
		title.textContent = `${detected.name} is on its standard port :${detected.port} — agent and server share the same address`;

		// Option A: SNIFF (zero-config) – DEFAULT
		let cardSniff = makeCard("sniff",
			"① Sniff (zero-config)",
			`Passive packet capture on <strong>127.0.0.1:${detected.port}</strong> via Scapy.<br>
			 Agent <b>and</b> server stay on <code>127.0.0.1:${detected.port}</code>. Nothing to change.<br>
			 <span style="color:var(--warn)">Windows: Npcap + Admin • Linux/macOS: root / CAP_NET_RAW</span>`,
			`<span style="width:auto">Agent</span> ──▶ <strong>127.0.0.1:${detected.port}</strong> ──▶ Server<br><span style="color:var(--muted)">    └── [sniffer tap, read-only] ──▶ UI</span>`,
			'<span class="opt-badge badge-ok">recommended</span>');
		cardSniff.onclick = () => pickOption("sniff", detected.port, detected.port, cardSniff);
		cards.appendChild(cardSniff);

		// Option B: redirect (agent changes to port+1) – fallback
		let nextPort = detected.port + 1;
		let cardB = makeCard("redirect",
			`② HTTP Proxy :${nextPort}`,
			`Classic HTTP reverse proxy. Listens on <strong>:${nextPort}</strong>, forwards to server on <strong>:${detected.port}</strong>.<br>
			 Change your agent to connect to <code>127.0.0.1:${nextPort}</code>. No admin needed.`,
			`<span style="width:auto">Agent</span> ──▶ <strong>127.0.0.1:${nextPort}</strong> ──▶ [proxy] ──▶ <strong>127.0.0.1:${detected.port}</strong> ──▶ Server`,
			'<span class="opt-badge badge-blue">fallback</span>');
		cardB.onclick = () => pickOption("redirect", nextPort, detected.port, cardB);
		cards.appendChild(cardB);

		// default: sniff
		pickOption("sniff", detected.port, detected.port, cardSniff);

	} else {
		// ── CASE 2: server on non-standard port ──
		// Assume agent is still on the standard port. So we proxy standard → non-standard.
		title.textContent = `${detected.name} is on non-standard port :${detected.port} (standard is :${standardPort})`;

		let cardP = makeCard("passthrough",
			"HTTP Proxy – standard → non-standard",
			`Proxy listens on standard port <strong>:${standardPort}</strong>, forwards to server on <strong>:${detected.port}</strong>.<br>
			 Agent connects to <code>127.0.0.1:${standardPort}</code> as usual. No agent config change.`,
			`<span style="width:auto">Agent</span> ──▶ <strong>127.0.0.1:${standardPort}</strong> ──▶ [proxy] ──▶ <strong>127.0.0.1:${detected.port}</strong> ──▶ Server`,
			'<span class="opt-badge badge-auto">auto</span>');
		cardP.onclick = () => pickOption("passthrough", standardPort, detected.port, cardP);
		cards.appendChild(cardP);

		pickOption("passthrough", standardPort, detected.port, cardP);
	}
}

function makeCard(mode, title, desc, diagram, badge) {
	let d = document.createElement("div");
	d.className = "option-card";
	d.dataset.mode = mode;
	d.innerHTML = `<div class="opt-title">${title} ${badge||""}</div>
		<div class="opt-desc">${desc}</div>
		<div class="opt-diagram">${diagram}</div>`;
	return d;
}

function pickOption(mode, proxyPort, targetPort, card) {
	chosenMode = mode;
	chosenProxyPort = proxyPort;
	chosenTargetPort = targetPort;

	document.querySelectorAll("#optionCards .option-card").forEach(c => c.classList.remove("selected"));
	card.classList.add("selected");

	document.getElementById("btnGo").disabled = false;

	if (mode === "sniff") {
		document.getElementById("goSummary").innerHTML =
			`Sniff: <code>127.0.0.1:${targetPort}</code> → read-only tap`;
	} else {
		document.getElementById("goSummary").innerHTML =
			`Proxy: <code>127.0.0.1:${proxyPort}</code> → Target: <code>127.0.0.1:${targetPort}</code>`;
	}

	const summaries = {
		sniff: `Sniff mode — passive capture on :${targetPort}. Agent and server both stay on 127.0.0.1:${targetPort}. Requires Admin/root + Npcap (Windows).`,
		redirect: `Redirect — proxy on :${proxyPort}, forward to :${targetPort}`,
		passthrough: `Passthrough — proxy on :${proxyPort}, forward to :${targetPort}`,
		bridge: `Transparent bridge — needs admin/root`
	};
	document.getElementById("optionSummary").textContent = summaries[mode] || mode;
}

async function confirmStartup() {
	if (!chosenMode) return;
	let payload = {
		target: "http://127.0.0.1:" + chosenTargetPort,
		mode: chosenMode,
		proxyPort: chosenProxyPort,
	};
	try {
		let r = await fetch("/api/config", {
			method:"POST",
			headers:{"Content-Type":"application/json"},
			body: JSON.stringify(payload)
		});
		finishUI(await r.json());
	} catch(e) {
		document.getElementById("optionSummary").innerHTML =
			'<span style="color:var(--err)">Error: ' + e.message + '</span>';
	}
}

function finishUI(cfg) {
	currentTarget = cfg.target || "";
	chosenMode = cfg.mode || "";
	document.getElementById("startupOverlay").style.display = "none";
	document.getElementById("mainUI").classList.remove("hidden");
	let labelMap = {
		sniff: "👁 sniff",
		redirect: "↩ redirect",
		passthrough: "⇄ passthrough",
		bridge: "🔗 bridge"
	};
	let label = labelMap[chosenMode] || chosenMode;
	document.getElementById("modeIndicator").textContent = label + " · " + currentTarget.replace("http://","");
	startProxyUI();
}

function reopenStartup() {
	document.getElementById("startupOverlay").style.display = "";
	document.getElementById("mainUI").classList.add("hidden");
	document.getElementById("scanMsg").textContent = "Scanning for servers…";
	document.getElementById("optionsSection").classList.add("hidden");
	document.getElementById("btnGo").disabled = true;
	document.getElementById("goSummary").textContent = "";
	initStartup(true);
}



// ═══════════════════════════════════════════════════
//  PROXY EVENT LOG
// ═══════════════════════════════════════════════════

let logEl, statusEl, filterEl, hideEmptyEl, btnNewOnTop, btnAutoScroll;
let count=0, newOnTop=true, autoScroll=false, maxDomEvents=2000, connected=false, activeGroups={};

function startProxyUI() {
	logEl=document.getElementById("log"); statusEl=document.getElementById("status");
	filterEl=document.getElementById("filter"); hideEmptyEl=document.getElementById("hideEmpty");
	btnNewOnTop=document.getElementById("btnNewOnTop"); btnAutoScroll=document.getElementById("btnAutoScroll");
	syncToggle(btnNewOnTop,newOnTop); syncToggle(btnAutoScroll,autoScroll); connect(); updateStatus();
}
function syncToggle(b,on){b.className=on?"toggle-on":"toggle-off";}
function toggleNewOnTop(){newOnTop=!newOnTop;syncToggle(btnNewOnTop,newOnTop);updateStatus();}
function toggleAutoScroll(){autoScroll=!autoScroll;syncToggle(btnAutoScroll,autoScroll);updateStatus();}
function updateStatus(){if(!statusEl)return;statusEl.textContent=`${connected?"connected":"disconnected"} | events: ${count} | new-on-top: ${newOnTop?"on":"off"} | auto-scroll: ${autoScroll?"on":"off"}`;}
function clearLog(){logEl.innerHTML="";count=0;activeGroups={};updateStatus();}
function expandAll(){document.querySelectorAll(".event").forEach(e=>e.classList.add("open"));document.querySelectorAll(".event-group").forEach(e=>e.open=true);}
function collapseAll(){document.querySelectorAll(".event").forEach(e=>e.classList.remove("open"));document.querySelectorAll(".event-group").forEach(e=>e.open=false);}
function applyFilter(){let q=filterEl.value.toLowerCase(),hide=hideEmptyEl.checked;document.querySelectorAll(".event").forEach(e=>{e.classList.toggle("hidden",(!(!q||e.dataset.search.includes(q)))||(hide&&e.classList.contains("empty")));});document.querySelectorAll(".event-group").forEach(g=>{g.classList.toggle("hidden",!g.querySelector(".event:not(.hidden)"))});}

function fmt(t){return new Date(t).toLocaleTimeString("en-GB",{hour12:false});}
function evSearch(e){return JSON.stringify(e).toLowerCase();}
function sumClass(e){return e.summary==="[DONE]"?"done":e.kind?.includes("error")?"err":"";}
function normalizeSum(s){if(!s)return"";let m=s.match(/^(.+?)\s\+\d+c$/);return m?m[1]:s;}
function grpKey(e){return(e.dir||"")+"|"+(e.kind||"")+"|"+normalizeSum(e.summary||"");}
function charCnt(s){if(!s)return 0;let m=s.match(/\+(\d+)c/);return m?+m[1]:0;}

function mkGroup(ev){
	let d=document.createElement("details");d.className="event-group";d.open=false;
	let sm=document.createElement("summary");
	let dirS=Object.assign(document.createElement("span"),{className:"dir "+(ev.dir?.includes("server")?"studio":"agent"),textContent:ev.dir||""});
	let kindS=Object.assign(document.createElement("span"),{className:"kind",textContent:ev.kind||""});
	let sumS=Object.assign(document.createElement("span"),{className:"summary "+sumClass(ev),textContent:normalizeSum(ev.summary||"")});
	let badge=Object.assign(document.createElement("span"),{className:"group-badge",textContent:"×1"});
	let charsS=Object.assign(document.createElement("span"),{className:"group-chars"});

	sm.append(dirS,kindS,sumS,badge,charsS);
	let body=document.createElement("div");body.className="group-body";

	d.append(sm,body);
	return{el:d,badge,charsSpan:charsS,body};
}

function mkEvent(ev){
	let item=document.createElement("div");item.className="event";
	let cLen=ev.json!=null?JSON.stringify(ev.json).length:ev.text!=null?ev.text.length:0;
	if(!cLen)item.classList.add("empty");
	item.dataset.search=evSearch(ev);
	let head=document.createElement("div");head.className="head";

	head.onclick=()=>item.classList.toggle("open");

	head.innerHTML=`<span class="seq">${ev.seq}</span><span class="time">${fmt(ev.ts)}</span><span class="summary ${sumClass(ev)}">${esc(ev.summary||"")}</span>`;
	let body=document.createElement("div");body.className="body";
	let pre=document.createElement("pre");
	if(ev.json!=null)pre.innerHTML=renderJson(ev.json,0);
	else if(ev.text!=null)pre.textContent=ev.text;
	else pre.textContent=JSON.stringify(ev,null,2);
	body.append(pre);item.append(head,body);
	return item;
}

function renderEvent(ev){
	count++;
	let key=grpKey(ev),chars=charCnt(ev.summary),grp=activeGroups[key];
	let seq=grp?.seqs;
	if(grp&&seq.length&&(seq[seq.length-1]===ev.seq-1||seq[seq.length-1]===ev.seq)){
		grp.n++;grp.c+=chars;seq.push(ev.seq);
		grp.badge.textContent="×"+grp.n;
		if(grp.c)grp.charsSpan.textContent=`(${grp.c} chars)`;
		grp.body.append(mkEvent(ev));
	}else{
		if(grp)delete activeGroups[key];
		let g=mkGroup(ev);g.n=1;g.c=chars;g.seqs=[ev.seq];
		if(chars)g.charsSpan.textContent=`(${chars} chars)`;
		g.body.append(mkEvent(ev));
		if(newOnTop)logEl.prepend(g.el);else logEl.appendChild(g.el);
		activeGroups[key]=g;
	}
	while(logEl.children.length>maxDomEvents)logEl.removeChild(newOnTop?logEl.lastChild:logEl.firstChild);
	applyFilter();
	if(autoScroll)logEl.scrollTop=newOnTop?0:logEl.scrollHeight;
	updateStatus();
}

function renderJson(v,ind){
	const sp="\t".repeat(ind),sp2="\t".repeat(ind+1);
	if(v&&typeof v==="object"&&v.__big_string__)return`<details class="big"><summary>${v.chars} chars, preview</summary>${esc(v.preview)}</details>`;
	if(Array.isArray(v))return v.length?"[\n"+v.map(x=>sp2+renderJson(x,ind+1)).join(",\n")+"\n"+sp+"]":"[]";
	if(v&&typeof v==="object"){let k=Object.keys(v);return k.length?"{\n"+k.map(k=>`${sp2}<span class="json-key">${esc(JSON.stringify(k))}</span>: ${renderJson(v[k],ind+1)}`).join(",\n")+"\n"+sp+"}":"{}";}
	return esc(JSON.stringify(v));
}

function esc(s){if(s==null)return"";let d=document.createElement("div");d.textContent=String(s);return d.innerHTML;}

function connect(){
	let p=location.protocol==="https:"?"wss:":"ws:";
	let ws=new WebSocket(`${p}//${location.host}/_ws`);
	ws.onopen=()=>{connected=true;updateStatus();};
	ws.onmessage=m=>{try{renderEvent(JSON.parse(m.data))}catch(e){}};
	ws.onclose=()=>{connected=false;updateStatus();setTimeout(connect,1000);};
	ws.onerror=()=>{connected=false;updateStatus();try{ws.close()}catch(e){}};
}

// live-reload
let lastMt=0;
(async()=>{try{lastMt=(await(await fetch("/_ui-mtime")).json()).mtime}catch(e){}
setInterval(async()=>{try{let{mtime:m}=await(await fetch("/_ui-mtime")).json();if(m&&m!==lastMt)location.reload()}catch(e){}},2000)})();

initStartup();
</script>
