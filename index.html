<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>LM Traffic View</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0b0e14;
			--panel: #111827;
			--border: #263244;
			--muted: #9ca3af;
			--text: #e5e7eb;
			--agent: #38bdf8;
			--studio: #a78bfa;
			--err: #fb7185;
			--ok: #34d399;
			--warn: #fbbf24;
			--toggle-on: #2563eb;
			--toggle-on-border: #60a5fa;
		}
		body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
		#toolbar { height:48px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--border); background:#05070b; }
		button,input { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; }
		button:hover { border-color:#4b5563; cursor:pointer; }
		input { width:360px; }
		button.toggle-on { background:var(--toggle-on); border-color:var(--toggle-on-border); color:#fff; box-shadow:0 0 6px rgba(37,99,235,.45); }
		button.toggle-off { background:#1e1e2e; border-color:#3b3b50; color:#9ca3af; }
		button.btn-clear { background:#7f1d1d; border-color:#b91c1c; color:#fca5a5; }
		button.btn-clear:hover { background:#991b1b; border-color:#ef4444; }
		#status { margin-left:auto; color:var(--muted); font-size:13px; }
		#log { height:calc(100vh - 49px); overflow:auto; padding:10px; box-sizing:border-box; }
		.event { border:1px solid var(--border); background:rgba(17,24,39,.75); border-radius:10px; margin-bottom:8px; overflow:hidden; }
		.head { display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; border-bottom:1px solid rgba(38,50,68,.7); }
		.seq { color:var(--muted); width:64px; flex:0 0 auto; }
		.time { color:var(--muted); width:90px; flex:0 0 auto; }
		.dir.agent { color:var(--agent); }
		.dir.studio { color:var(--studio); }
		.kind { color:#d1d5db; background:#1f2937; padding:2px 6px; border-radius:999px; flex:0 0 auto; }
		.summary { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
		.summary.done { color:var(--ok); }
		.summary.err { color:var(--err); }
		.body { padding:8px 10px 10px; display:none; }
		.event.open .body { display:block; }
		.event-group { border:1px solid #2d3748; border-radius:10px; margin-bottom:8px; overflow:hidden; }
		.event-group summary { display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; cursor:pointer; list-style:none; background:rgba(17,24,39,.85); user-select:none; }
		.event-group summary::-webkit-details-marker { display:none; }
		.event-group summary::before { content:"▶"; font-size:9px; color:var(--muted); transition:transform .15s; flex:0 0 auto; }
		.event-group[open] summary::before { transform:rotate(90deg); }
		.group-badge { background:#374151; color:#d1d5db; padding:1px 7px; border-radius:999px; font-size:12px; flex:0 0 auto; }
		.group-chars { color:var(--muted); font-size:12px; flex:0 0 auto; }
		.group-body { padding:4px; }
		.group-body .event { margin-bottom:4px; border-color:#1e293b; }
		.group-body .event .head { padding:5px 10px; font-size:12px; }
		.group-body .event .head .summary { color:var(--muted); }
		pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; font-size:12px; line-height:1.45; }
		.json-key { color:#93c5fd; }
		.big { border:1px dashed #374151; border-radius:8px; padding:8px; margin:4px 0; color:var(--muted); }
		.hidden { display:none; }

		/* ═══ modal ═══ */
		.modal { background:var(--panel); border:1px solid var(--border); border-radius:14px; width:760px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.5); }
		.modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; }
		.modal-header .close-btn { background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; padding:0 4px; line-height:1; }
		.modal-header .close-btn:hover { color:var(--text); }
		.modal-body { overflow-y:auto; padding:14px 18px; }
		.modal-body table { width:100%; border-collapse:collapse; font-size:13px; }
		.modal-body th { text-align:left; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border); font-size:12px; }
		.modal-body td { padding:8px; border-bottom:1px solid #1a2233; vertical-align:middle; }
		tr.server-row { cursor:pointer; }
		tr.server-row:hover { background:rgba(56,189,248,.06); }
		tr.server-row.selected { background:rgba(37,99,235,.18); }
		tr.server-row.selected td:first-child { border-left:3px solid var(--toggle-on); padding-left:5px; }
		.modal-body a { color:var(--agent); text-decoration:none; }
		.modal-body a:hover { text-decoration:underline; }
		.status-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; flex:0 0 auto; }
		.status-dot.checking { background:var(--warn); animation:pulse .8s infinite alternate; }
		.status-dot.online { background:var(--ok); }
		.status-dot.offline { background:#4b5563; }
		@keyframes pulse { from{opacity:.4} to{opacity:1} }
		.modal-footer { padding:12px 18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
		.right { margin-left:auto; }

		/* ═══ startup ═══ */
		#startupOverlay { position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; justify-content:center; align-items:center; }
		#startupOverlay .modal { width:840px; max-height:90vh; }
		.option-cards { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
		.option-card { flex:1; min-width:240px; border:2px solid var(--border); border-radius:10px; padding:16px; cursor:pointer; transition:border-color .15s,background .15s; background:rgba(17,24,39,.5); }
		.option-card:hover { border-color:#4b5563; }
		.option-card.selected { border-color:var(--toggle-on); background:rgba(37,99,235,.12); }
		.option-card .opt-title { font-weight:600; font-size:14px; margin-bottom:8px; }
		.option-card .opt-desc { font-size:12px; color:var(--muted); line-height:1.6; }
		.option-card .opt-diagram { margin-top:12px; font-family:ui-monospace,monospace; font-size:11px; color:var(--agent); background:#0b0e14; padding:8px; border-radius:6px; line-height:1.7; }
		.opt-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; font-weight:500; margin-left:6px; }
		.btn-primary { background:#1d4ed8; border-color:#3b82f6; color:#fff; padding:9px 24px; font-weight:600; font-size:14px; }
		.btn-primary:hover { background:#2563eb; }
		.btn-primary:disabled { opacity:.4; cursor:not-allowed; }
		#modeIndicator { font-size:12px; padding:4px 10px; border-radius:999px; background:#1e293b; border:1px solid var(--border); color:var(--muted); cursor:pointer; }
		#modeIndicator:hover { border-color:#4b5563; }
		.badge-warn { background:#713f12; color:#fde68a; }
		.badge-ok { background:#166534; color:#86efac; }
		.badge-auto { background:#166534; color:#86efac; }
		.badge-blue { background:#1e3a8a; color:#93c5fd; }
			input.port-in { width:80px; padding:4px 6px; }
		.err-msg { color:var(--err); }
		.group-time { color:var(--muted); font-size:12px; flex:0 0 auto; width:64px; }
		.dir { flex:0 0 auto; }
		tr.server-row.offline { cursor:default; opacity:.6; }
	</style>
</head>
<body>

<!-- ═══ STARTUP ═══ -->
<div id="startupOverlay">
<div class="modal">
	<div class="modal-header"><span>🚀 LM Traffic View — Setup</span></div>
	<div class="modal-body">
		<p id="scanMsg" style="margin:0 0 14px;color:var(--muted);font-size:13px;">Scanning for servers…</p>
		<table>
			<thead><tr><th style="width:28px"></th><th>Server</th><th>Port</th><th>Endpoint</th><th>Download</th></tr></thead>
			<tbody id="startupBody"></tbody>
		</table>
		<div id="optionsSection" class="hidden">
			<div style="margin:20px 0 8px;font-weight:600;font-size:14px;" id="optionsTitle"></div>
			<div class="option-cards" id="optionCards"></div>
			<div id="optionSummary" style="font-size:13px;color:var(--muted);min-height:40px;"></div>
		</div>
	</div>
	<div class="modal-footer">
		<button class="btn-primary" id="btnGo" disabled onclick="confirmStartup()">Apply & Continue →</button>
		<button onclick="reopenStartup()">Rescan</button>
		<span class="right" id="goSummary"></span>
	</div>
</div>
</div>

<!-- ═══ MAIN UI ═══ -->
<div id="mainUI" class="hidden">
<div id="toolbar">
	<button class="btn-clear" onclick="clearLog()">Clear</button>
	<button onclick="expandAll()">Expand all</button>
	<button onclick="collapseAll()">Collapse all</button>
	<button id="btnNewOnTop" class="toggle-on" onclick="toggleNewOnTop()">New on top</button>
	<button id="btnAutoScroll" class="toggle-off" onclick="toggleAutoScroll()">Auto-scroll</button>
	<label style="font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;">
		<input type="checkbox" id="hideEmpty" onchange="applyFilter()" style="width:auto;" /> Hide 0-byte
	</label>
	<span id="modeIndicator" onclick="reopenStartup()" title="Click to change server / mode"></span>
	<input id="filter" placeholder="filter…" oninput="applyFilter()" />
	<span id="status"></span>
</div>
<div id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let chosen = null;   // {mode, proxyPort, targetPort}
let detectedSrv = null;

// ═══════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════

async function initStartup(forceShow) {
	try {
		let c = await (await fetch("/api/config")).json();
		if (c.configured && c.proxyRunning && !forceShow) { finishUI(c); return; }
		if (c.error) $("optionSummary").innerHTML = `<span class="err-msg">${esc(c.error)}</span>`;
	} catch(e){}

	let scan;
	try { scan = await (await fetch("/api/scan")).json(); } catch(e){ scan = {servers:[]}; }

	let tbody = $("startupBody");
	tbody.innerHTML = "";
	scan.servers.forEach(srv => {
		if (srv.nonStandard && !srv.open) return;   // only show moved servers if found
		let tr = document.createElement("tr");
		tr.className = "server-row " + (srv.open ? "" : "offline");
		tr.dataset.port = srv.port;
		tr.innerHTML = `<td><span class="status-dot ${srv.open ? "online" : "offline"}"></span></td>
			<td style="font-weight:500">${esc(srv.name)}</td>
			<td>${srv.port}${srv.nonStandard ? ` <span style="color:var(--warn);font-size:10px">(standard :${srv.parentPort})</span>` : ""}</td>
			<td style="color:var(--muted);font-size:12px">${esc(srv.endpoint)}</td>
			<td>${srv.nonStandard ? "—" : `<a href="${esc(srv.url)}" target="_blank" onclick="event.stopPropagation()">↗</a>`}</td>`;
		if (srv.open) tr.onclick = () => selectServer(srv);
		tbody.appendChild(tr);
	});

	let online = scan.servers.filter(s => s.open);
	if (!online.length) {
		$("scanMsg").innerHTML = '<span class="err-msg">No servers detected. Start a server and press Rescan, or enter ports manually below.</span>';
		buildOptions(null);
		return;
	}
	selectServer(online[0]);
}

function selectServer(srv) {
	detectedSrv = srv;
	document.querySelectorAll("#startupBody .server-row").forEach(r => r.classList.toggle("selected", +r.dataset.port === srv.port));
	let portInfo = srv.nonStandard
		? `<code>127.0.0.1:${srv.port}</code> <span style="color:var(--warn)">(standard port for ${esc(srv.name)} is :${srv.parentPort})</span>`
		: `<code>127.0.0.1:${srv.port}</code> (standard)`;
	$("scanMsg").innerHTML = `Detected <strong style="color:var(--ok)">${esc(srv.name)}</strong> on ${portInfo}`;
	buildOptions(srv);
}

function buildOptions(d) {
	let title = $("optionsTitle"), cards = $("optionCards");
	$("optionsSection").classList.remove("hidden");
	cards.innerHTML = "";
	let first = null;
	const add = (card, mode, pp, tp) => {
		card.onclick = () => pickOption(mode, pp, tp, card);
		cards.appendChild(card);
		first = first || (() => pickOption(mode, pp, tp, card));
	};

	if (d && !d.nonStandard) {
		// CASE 1: server on its standard port – agent already points there
		title.textContent = `${d.name} is on its standard port :${d.port}`;
		add(makeCard("① Sniff (zero-config)",
			`Passive capture on <strong>127.0.0.1:${d.port}</strong>. Agent <b>and</b> server stay as is.<br>
			 <span style="color:var(--warn)">Windows: Npcap + Admin • Linux/macOS: root</span>`,
			`Agent ──▶ <strong>127.0.0.1:${d.port}</strong> ──▶ Server<br><span style="color:var(--muted)">    └── [read-only tap] ──▶ UI</span>`,
			'<span class="opt-badge badge-ok">recommended</span>'), "sniff", d.port, d.port);
		let next = d.port + 1;
		add(makeCard(`② HTTP proxy :${next}`,
			`Proxy listens on <strong>:${next}</strong>, forwards to <strong>:${d.port}</strong>.<br>
			 Change agent to <code>127.0.0.1:${next}</code>. No admin needed.`,
			`Agent ──▶ <strong>:${next}</strong> ──▶ [proxy] ──▶ <strong>:${d.port}</strong> ──▶ Server`,
			'<span class="opt-badge badge-blue">fallback</span>'), "redirect", next, d.port);
	} else if (d) {
		// CASE 2: server moved to non-standard port – agent stays on standard
		let std = d.parentPort;
		title.textContent = `${d.name} is on non-standard port :${d.port} (standard is :${std})`;
		add(makeCard("HTTP proxy standard → moved server",
			`Proxy listens on <strong>:${std}</strong>, forwards to <strong>:${d.port}</strong>.<br>
			 Agent keeps <code>127.0.0.1:${std}</code>. Nothing to change.`,
			`Agent ──▶ <strong>:${std}</strong> ──▶ [proxy] ──▶ <strong>:${d.port}</strong> ──▶ Server`,
			'<span class="opt-badge badge-auto">auto</span>'), "passthrough", std, d.port);
	} else {
		title.textContent = "Manual setup";
	}

	// Manual: any ports. same ports → sniff, different → proxy
	let sp = d ? d.port : 1234, ap = d ? (d.nonStandard ? d.parentPort : d.port + 1) : 1235;
	let manual = makeCard("✎ Manual",
		`Server port <input class="port-in" id="mServer" type="number" value="${sp}">
		 Agent port <input class="port-in" id="mAgent" type="number" value="${ap}"><br>
		 Same port → sniff, different → HTTP proxy.`,
		`Agent ──▶ :agent ──▶ [proxy | tap] ──▶ :server`, "");
	manual.onclick = () => pickOption("manual", 0, 0, manual);
	manual.querySelectorAll("input").forEach(i => i.oninput = () => pickOption("manual", 0, 0, manual));
	cards.appendChild(manual);
	(first || (() => pickOption("manual", 0, 0, manual)))();
}

function makeCard(title, desc, diagram, badge) {
	let d = document.createElement("div");
	d.className = "option-card";
	d.innerHTML = `<div class="opt-title">${title} ${badge||""}</div>
		<div class="opt-desc">${desc}</div>
		<div class="opt-diagram">${diagram}</div>`;
	return d;
}

function pickOption(mode, proxyPort, targetPort, card) {
	if (mode === "manual") {
		targetPort = +$("mServer").value; proxyPort = +$("mAgent").value;
		mode = targetPort === proxyPort ? "sniff" : "proxy";
	}
	chosen = {mode, proxyPort, targetPort};
	document.querySelectorAll("#optionCards .option-card").forEach(c => c.classList.remove("selected"));
	card.classList.add("selected");
	$("btnGo").disabled = !(targetPort > 0 && proxyPort > 0);
	$("goSummary").innerHTML = mode === "sniff"
		? `Sniff <code>127.0.0.1:${targetPort}</code> (read-only)`
		: `Agent → <code>127.0.0.1:${proxyPort}</code> → server <code>127.0.0.1:${targetPort}</code>`;
	$("optionSummary").textContent = mode === "sniff"
		? `Sniff — passive capture on :${targetPort}. Needs Admin/root (+ Npcap on Windows).`
		: `HTTP proxy — listen :${proxyPort}, forward to :${targetPort}. Point the agent to :${proxyPort}.`;
}

async function confirmStartup() {
	if (!chosen) return;
	$("btnGo").disabled = true;
	$("optionSummary").textContent = "Starting…";
	try {
		let r = await (await fetch("/api/config", {
			method: "POST", headers: {"Content-Type": "application/json"},
			body: JSON.stringify({target: "http://127.0.0.1:" + chosen.targetPort, mode: chosen.mode, proxyPort: chosen.proxyPort}),
		})).json();
		if (!r.ok) throw new Error(r.error || "failed");
		finishUI(r);
	} catch(e) {
		$("optionSummary").innerHTML = `<span class="err-msg">Error: ${esc(e.message)}</span>`;
		$("btnGo").disabled = false;
	}
}

function finishUI(cfg) {
	$("startupOverlay").style.display = "none";
	$("mainUI").classList.remove("hidden");
	let t = (cfg.target || "").replace("http://", "");
	$("modeIndicator").textContent = cfg.mode === "sniff"
		? `👁 sniff · ${t}`
		: `⇄ proxy · :${cfg.listenPort} → ${t}`;
	startLogUI();
}

function reopenStartup() {
	$("startupOverlay").style.display = "";
	$("mainUI").classList.add("hidden");
	$("scanMsg").textContent = "Scanning for servers…";
	$("optionsSection").classList.add("hidden");
	$("optionSummary").textContent = "";
	$("btnGo").disabled = true;
	$("goSummary").textContent = "";
	initStartup(true);
}

// ═══════════════════════════════════════════════════
//  EVENT LOG
// ═══════════════════════════════════════════════════

let logEl, statusEl, filterEl, hideEmptyEl, btnNewOnTop, btnAutoScroll, started = false;
let count = 0, newOnTop = true, autoScroll = false, connected = false;
let lastGroup = null, lastSeq = 0, bootId = "", pending = [], scheduled = false;
const MAX_GROUPS = 2000;

function startLogUI() {
	if (started) return;   // only one websocket, even after reconfigure
	started = true;
	logEl = $("log"); statusEl = $("status"); filterEl = $("filter"); hideEmptyEl = $("hideEmpty");
	btnNewOnTop = $("btnNewOnTop"); btnAutoScroll = $("btnAutoScroll");
	syncToggle(btnNewOnTop, newOnTop); syncToggle(btnAutoScroll, autoScroll);
	connect(); updateStatus();
}
function syncToggle(b, on) { b.className = on ? "toggle-on" : "toggle-off"; }
function toggleNewOnTop() { newOnTop = !newOnTop; syncToggle(btnNewOnTop, newOnTop); updateStatus(); }
function toggleAutoScroll() { autoScroll = !autoScroll; syncToggle(btnAutoScroll, autoScroll); updateStatus(); }
function updateStatus() { if (statusEl) statusEl.textContent = `${connected ? "connected" : "disconnected"} | events: ${count}`; }
function clearLog() { logEl.innerHTML = ""; count = 0; lastGroup = null; updateStatus(); }
function expandAll() { logEl.querySelectorAll(".event-group").forEach(g => { g.open = true; fillGroup(g._g); }); logEl.querySelectorAll(".event").forEach(openEvent); }
function openEvent(e) { e._fill(); e.classList.add("open"); }
function collapseAll() { logEl.querySelectorAll(".event").forEach(e => e.classList.remove("open")); logEl.querySelectorAll(".event-group").forEach(g => g.open = false); }

// filtering works on data, so folded (not yet rendered) group members are filtered too
function evText(ev) { return ev._s ??= JSON.stringify(ev).toLowerCase(); }
function evVisible(ev, q, hide) { return (!q || evText(ev).includes(q)) && !(hide && ev._empty); }
function applyGroupFilter(g, q = filterEl.value.toLowerCase(), hide = hideEmptyEl.checked) {
	g.el.classList.toggle("hidden", !g.events.some(ev => evVisible(ev, q, hide)));
	g.events.forEach(ev => ev._el && ev._el.classList.toggle("hidden", !evVisible(ev, q, hide)));
}
function applyFilter() { let q = filterEl.value.toLowerCase(), hide = hideEmptyEl.checked; logEl.querySelectorAll(".event-group").forEach(el => applyGroupFilter(el._g, q, hide)); }

function fmt(t) { return new Date(t).toLocaleTimeString("en-GB", {hour12: false}); }
function sumClass(e) { return e.summary === "[DONE]" ? "done" : (e.kind || "").includes("error") ? "err" : ""; }
function normalizeSum(s) { if (!s) return ""; let m = s.match(/^(.+?)\s\+\d+c$/); return m ? m[1] : s; }
function grpKey(e) { return (e.dir || "") + "|" + (e.kind || "") + "|" + normalizeSum(e.summary || ""); }
function charCnt(s) { let m = s && s.match(/\+(\d+)c/); return m ? +m[1] : 0; }
function dirClass(d) { return (d || "").startsWith("server") ? "studio" : "agent"; }

function mkGroup(ev) {
	let el = document.createElement("details"); el.className = "event-group";
	let sm = document.createElement("summary");
	sm.innerHTML = `<span class="seq">${ev.seq}</span><span class="group-time">${fmt(ev.ts)}</span>
		<span class="dir ${dirClass(ev.dir)}">${esc(ev.dir || "")}</span><span class="kind">${esc(ev.kind || "")}</span>
		<span class="summary ${sumClass(ev)}">${esc(normalizeSum(ev.summary || ""))}</span>
		<span class="group-badge hidden"></span><span class="group-chars"></span>`;
	let body = document.createElement("div"); body.className = "group-body";
	el.append(sm, body);
	let g = {el, body, key: grpKey(ev), events: [], chars: 0, rendered: 0,
		badge: sm.querySelector(".group-badge"), charsEl: sm.querySelector(".group-chars")};
	el._g = g;
	el.addEventListener("toggle", () => el.open && fillGroup(g));   // lazy: render members on first open
	return g;
}

function fillGroup(g) {
	let fresh = g.rendered === 0;
	while (g.rendered < g.events.length) g.body.append(mkEvent(g.events[g.rendered++]));
	if (fresh && g.events.length === 1) openEvent(g.events[0]._el);   // single event: show body at once
	applyGroupFilter(g);
}

function mkEvent(ev) {
	let item = document.createElement("div"); item.className = "event" + (ev._empty ? " empty" : "");
	ev._el = item;
	let head = document.createElement("div"); head.className = "head";
	head.innerHTML = `<span class="seq">${ev.seq}</span><span class="time">${fmt(ev.ts)}</span><span class="summary ${sumClass(ev)}">${esc(ev.summary || "")}</span>`;
	let body = document.createElement("div"); body.className = "body";
	let pre = document.createElement("pre");
	let filled = false;
	item._fill = () => { if (!filled) { filled = true; fillPre(pre, ev); } };   // lazy: build JSON view on first expand
	head.onclick = () => { item._fill(); item.classList.toggle("open"); };
	body.append(pre); item.append(head, body);
	return item;
}

function fillPre(pre, ev) {
	if (ev.json != null) pre.innerHTML = renderJson(ev.json, 0);
	else if (ev.text != null) pre.textContent = ev.text;
	else { let {_el, _s, _empty, ...rest} = ev; pre.textContent = JSON.stringify(rest, null, 2); }
}

function renderEvent(ev) {
	count++;
	ev._empty = !(ev.json != null ? JSON.stringify(ev.json).length : (ev.text || "").length);
	let key = grpKey(ev), g = lastGroup;
	if (!g || g.key !== key || !g.el.isConnected) {
		g = lastGroup = mkGroup(ev);
		if (newOnTop) logEl.prepend(g.el); else logEl.appendChild(g.el);
	}
	g.events.push(ev);
	g.chars += charCnt(ev.summary);
	if (g.events.length > 1) { g.badge.textContent = "×" + g.events.length; g.badge.classList.remove("hidden"); }
	if (g.chars) g.charsEl.textContent = `(${g.chars} chars)`;
	// incremental filter: only the new event is checked
	let vis = evVisible(ev, filterEl.value.toLowerCase(), hideEmptyEl.checked);
	if (g.el.open && g.rendered === g.events.length - 1) { g.body.append(mkEvent(ev)); g.rendered++; ev._el.classList.toggle("hidden", !vis); }
	if (vis) g.el.classList.remove("hidden"); else if (g.events.length === 1) g.el.classList.add("hidden");
}

function onEvent(ev) {
	if (ev.type === "hello") {
		if (ev.reset) { if (bootId) clearLog(); lastSeq = 0; }   // server restarted: seq starts over
		bootId = ev.boot;
		return;
	}
	if (ev.seq <= lastSeq) return;
	lastSeq = ev.seq;
	pending.push(ev);
	if (!scheduled) {   // batch DOM work: one flush per frame, however fast the stream
		scheduled = true;
		document.hidden ? setTimeout(flush, 300) : requestAnimationFrame(flush);
	}
}

function flush() {
	scheduled = false;
	let batch = pending; pending = [];
	batch.forEach(renderEvent);
	while (logEl.children.length > MAX_GROUPS) logEl.removeChild(newOnTop ? logEl.lastChild : logEl.firstChild);
	if (autoScroll) logEl.scrollTop = newOnTop ? 0 : logEl.scrollHeight;
	updateStatus();
}

function renderJson(v, ind) {
	const sp = "\t".repeat(ind), sp2 = "\t".repeat(ind + 1);
	if (v && typeof v === "object" && v.__big_string__) return `<details class="big"><summary>${v.chars} chars, preview</summary>${esc(v.preview)}</details>`;
	if (Array.isArray(v)) return v.length ? "[\n" + v.map(x => sp2 + renderJson(x, ind + 1)).join(",\n") + "\n" + sp + "]" : "[]";
	if (v && typeof v === "object") { let k = Object.keys(v); return k.length ? "{\n" + k.map(k => `${sp2}<span class="json-key">${esc(JSON.stringify(k))}</span>: ${renderJson(v[k], ind + 1)}`).join(",\n") + "\n" + sp + "}" : "{}"; }
	return esc(JSON.stringify(v));
}

function esc(s) { return s == null ? "" : String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }

function connect() {
	let p = location.protocol === "https:" ? "wss:" : "ws:";
	let ws = new WebSocket(`${p}//${location.host}/_ws?since=${lastSeq}&boot=${bootId}`);
	ws.onopen = () => { connected = true; updateStatus(); };
	ws.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch(e) { console.error(e); } };
	ws.onclose = () => { connected = false; updateStatus(); setTimeout(connect, 1000); };
	ws.onerror = () => { try { ws.close(); } catch(e){} };
}

// live-reload when index.html is edited
let lastMt = 0;
(async () => {
	try { lastMt = (await (await fetch("/_ui-mtime")).json()).mtime; } catch(e){}
	setInterval(async () => { try { let {mtime: m} = await (await fetch("/_ui-mtime")).json(); if (m && m !== lastMt) location.reload(); } catch(e){} }, 2000);
})();

initStartup();
</script>
